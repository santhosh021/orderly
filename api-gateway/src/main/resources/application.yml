server:
  port: 8080

spring:
  application:
    name: api-gateway

app:
  jwt:
    # Must be identical to the secret used by auth-service. Override with JWT_SECRET in real deployments.
    secret: ${JWT_SECRET:orderly-local-dev-secret-key-change-me-0123456789}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
