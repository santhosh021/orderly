server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false   # the registry does not register itself
    fetch-registry: false
  server:
    enable-self-preservation: false   # remove dead instances quickly (fine for a small demo)

management:
  endpoints:
    web:
      exposure:
        include: health
