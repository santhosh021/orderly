server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS; the variable makes nginx look the gateway up at request time,
    # so nginx still starts even if the gateway container is not ready yet.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: any other path serves index.html
    location / {
        try_files $uri /index.html;
    }
}
